  @font-face { font-family: "CG"; src: url(webfonts/cormorant-garamond-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "CG"; src: url(webfonts/cormorant-garamond-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "CG"; src: url(webfonts/cormorant-garamond-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "CG"; src: url(webfonts/cormorant-garamond-latin-700-italic.woff2) format("woff2"); font-weight: 700; font-style: italic; font-display: swap; }
  @font-face { font-family: "Engr"; src: url(webfonts/cinzel-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }

  :root {
    --ink: #00563b;

    --body: #00603f;
    --rule: #409785;
    --blue: #81D8D0;
    --gap: 15px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--blue);
    color: var(--ink);
    font-family: "CG", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 72px 24px 64px;
    text-align: center;
  }

  /* Header: SHAUNEEN up-left, DAVID down-right, around a centered & */
  .names {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    column-gap: 18px;
    font-weight: 500;
    font-size: clamp(22px, 5.4vw, 40px);
    letter-spacing: 0.28em;
    line-height: 1;
    margin: 0;
  }
  .names .her { justify-self: end; align-self: start; margin-top: 0.5em; margin-right: -0.28em; }
  .names .amp { font-size: 2.9em; letter-spacing: 0; line-height: 0.8; }
  .names .him { justify-self: start; align-self: end; margin-bottom: 0.5em; }

  .intro {
    font-style: italic;
    font-size: clamp(26px, 5.6vw, 40px);
    line-height: 1.04;
    margin: 56px auto 0;
  }

  hr {
    width: 96px;
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 56px auto;
  }

  .ring > * { margin: 0; }
  .ring > * + * { margin-top: var(--gap); }
  .inscription {
    font-family: "Engr", serif;
    font-weight: 400;
    font-size: clamp(44px, 10vw, 67px);
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .who {
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.31em;
    margin-right: -0.31em;
    color: var(--muted);
  }
  .lang {
    font-size: 17px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .lang svg { height: 11px; width: auto; display: block; }
  .desc {
    font-style: italic;
    font-size: 20px;
    line-height: 1.37;
    color: var(--body);
    max-width: 535px;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  .desc b { font-style: normal; font-weight: 700; }
  .nb { white-space: nowrap; }

  footer { margin-top: 64px; }
  footer img { width: 118px; height: auto; display: block; margin: 0 auto; }
  .craft-label {
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.32em;
    margin: 18px 0 0;
  }
  .craft {
    font-size: 12.5px;
    line-height: 1.5;
    opacity: 0.76;
    color: var(--body);
    margin: 10px 0 0;
  }
  .pdf {
    display: inline-block;
    margin-top: 36px;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 3px;
  }
  .pdf:hover { color: var(--ink); border-color: var(--ink); }

  /* Password gate: the published page holds only ciphertext (see encrypt_page.py) */
  body.locked main { display: none; }
  .gate { display: none; min-height: 100vh; align-items: center; justify-content: center; }
  body.locked .gate { display: flex; }
  .gate form { text-align: center; }
  .gate label {
    display: block;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.32em;
    margin-bottom: 14px;
  }
  .gate input {
    font: italic 24px "CG", Georgia, serif;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--rule);
    text-align: center;
    width: 220px;
    padding: 4px 0;
    outline: none;
  }
  .gate input:focus { border-color: var(--ink); }
  .gate.wrong input { border-color: var(--ink); animation: nope 0.3s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>

  var enc = new TextEncoder(), dec = new TextDecoder();

  function derive(pw) {
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {

    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct)).then(function (buf) {

      document.body.classList.remove("locked");
      var link = document.querySelector("a.pdf");
      if (link) link.addEventListener("click", function (e) { e.preventDefault(); download(key); });
      return key;
    });
  }

  function download(key) {
    fetch(P.pdf.file).then(function (r) { return r.arrayBuffer(); }).then(function (data) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.pdf.iv) }, key, data);

      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    });
  }

    return crypto.subtle.exportKey("raw", key).then(function (raw) {
